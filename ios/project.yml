# XcodeGen spec for the Ah Bo iPad app (PRD §25.1). Generate with:  cd ios && xcodegen && open AhBo.xcodeproj
# XcodeGen 2.46.0 is the version this spec was written against (ProjectSpec.md, verified 10 Nov 2026).
name: AhBo
options:
  bundleIdPrefix: hk.ahbo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # choose your Personal Team in Xcode → Signing & Capabilities

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.18.0            # VERIFIED tag (2026-10-16, commit 93a7251); see API_VERIFICATION.md

targets:
  AhBo:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AhBo
        excludes:
          - "Resources/fixed/**"     # generated by ops (`ahbo render-fixed`); added below as a folder reference
      # Fixed clips bundled as the offline fallback (§10.3). Folder reference → bundle path "fixed/".
      - path: AhBo/Resources/fixed
        type: folder
        optional: true
        buildPhase: resources
      # The ONE face (§25.1): the repo's ../face as a blue folder reference, never a copy.
      # dev.html must not ship (§25.5): the exclude below is honoured if your XcodeGen applies excludes to
      # folder references; the post-build script "Strip face/dev.html" removes it from the bundle either way.
      - path: ../face
        type: folder
        buildPhase: resources
        excludes:
          - dev.html
      # Wake-match defaults, read at launch (server `welcome.config.wake` overrides). Single source.
      - path: ../brain/config/wake_match.yaml
        buildPhase: resources
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.ahbo.app       # change here if the ID is taken for your Personal Team
        PRODUCT_NAME: AhBo
        INFOPLIST_FILE: AhBo/Info.plist
        TARGETED_DEVICE_FAMILY: "2"                  # iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO            # the dev.html strip script edits the built bundle
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Strip face/dev.html
        basedOnDependencyAnalysis: false
        script: |
          rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/face/dev.html"
          if [ ! -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/face/index.html" ]; then
            echo "error: face/index.html missing from the bundle (is ../face present next to ios/?)"; exit 1
          fi

  AhBoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AhBoTests
      # The matcher is pure Swift: compile it straight into the test bundle (no host app, no LiveKit).
      - path: AhBo/Wake/JyutpingMatcher.swift
      # Shared fixtures, read directly from their single sources (no copies, no conversions).
      - path: ../brain/config/wake_cases.yaml
        buildPhase: resources
      - path: ../brain/config/wake_match.yaml
        buildPhase: resources
      - path: AhBo/Resources/wake_homophones.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hk.ahbo.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  AhBo:
    build:
      targets:
        AhBo: all
        AhBoTests: [test]
    test:
      targets:
        - AhBoTests
    run:
      config: Debug
