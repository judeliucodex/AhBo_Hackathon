<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ah Bo Face Dev</title>
<style>
  :root{--bg:#111;--panel:#1b1b1b;--ink:#ECE3E7;--dim:rgba(236,227,231,.5);--line:rgba(236,227,231,.15)}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,sans-serif}
  body{display:grid;grid-template-columns:1fr 340px;gap:0}
  .screen{display:grid;place-items:center;padding:16px;min-width:0}
  /* iPad Air 5 landscape = 1180 x 820 points */
  .bezel{width:min(100%, calc((100vh - 32px) * 1180 / 820));aspect-ratio:1180/820;border:10px solid #2a2a2a;border-radius:22px;overflow:hidden;background:#000}
  .bezel.portrait{aspect-ratio:820/1180;width:min(100%, calc((100vh - 32px) * 820 / 1180))}
  iframe{width:100%;height:100%;border:0;display:block}
  aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
  h1{font-size:14px;margin:0 0 10px}
  h2{font-size:12px;margin:16px 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  button{font:600 12px system-ui;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--dim)}
  button.primary{background:var(--ink);color:#000;border-color:var(--ink)}
  textarea{width:100%;box-sizing:border-box;height:90px;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:12px ui-monospace,monospace;padding:8px}
  #log{font:11px/1.45 ui-monospace,monospace;color:var(--dim);white-space:pre-wrap;max-height:220px;overflow:auto;background:#000;border-radius:8px;padding:8px}
  @media (max-width: 900px){ body{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<div class="screen"><div class="bezel" id="bezel"><iframe id="face" src="index.html" title="Ah Bo face"></iframe></div></div>
<aside>
  <h1>Ah Bo face: dev harness</h1>
  <div class="row"><button id="rot">Rotate</button><button data-cmd='{"type":"reset"}'>Reset</button><button data-cmd='{"type":"birth"}'>Birth</button></div>

  <h2>Storyboards (no audio)</h2>
  <div class="row">
    <button class="primary" data-story="S1">S1 Voice note</button>
    <button class="primary" data-story="S2">S2 Medicine</button>
    <button class="primary" data-story="S3">S3 Day plan</button>
    <button class="primary" data-story="S4">S4 Fall</button>
    <button class="primary" data-story="S4ok">S4 she's OK</button>
  </div>

  <h2>Mood</h2>
  <div class="row" id="moods"></div>

  <h2>Expressions and widgets</h2>
  <div class="row">
    <button data-cmd='{"type":"expr","expr":"blink"}'>blink</button>
    <button data-cmd='{"type":"expr","expr":"happy"}'>happy</button>
    <button data-cmd='{"type":"expr","expr":"wake"}'>wake</button>
    <button data-cmd='{"type":"flash"}'>flash</button>
    <button data-cmd='{"type":"ok_button","show":true}'>OK button on</button>
    <button data-cmd='{"type":"ok_button","show":false}'>OK button off</button>
    <button data-cmd='{"type":"countdown","id":"cd","n":5}'>countdown 5</button>
    <button data-cmd='{"type":"offline","on":true}'>offline on</button>
    <button data-cmd='{"type":"offline","on":false}'>offline off</button>
    <button data-cmd='{"type":"card_clear"}'>clear cards</button>
    <button data-cmd='{"type":"steps_clear"}'>clear steps</button>
  </div>

  <h2>Send any command (JSON)</h2>
  <textarea id="json">{"type":"say_start","id":"t1","text":"王婆婆，早晨！今日天氣好好，記得飲多啲水呀。","durationSec":4.5}</textarea>
  <div class="row" style="margin-top:6px"><button id="send" class="primary">Send</button><button data-cmd='{"type":"say_end","id":"t1"}'>say_end t1</button></div>

  <h2>Events from the face</h2>
  <div id="log"></div>
</aside>
<script>
"use strict";
const frame = document.getElementById("face");
const logEl = document.getElementById("log");
const send = cmd => frame.contentWindow.postMessage({ ahbo: cmd }, "*");
function log(s){ logEl.textContent = s + "\n" + logEl.textContent.slice(0, 6000); }

// Events from the face come back over postMessage (see bridge.js, iframe mode)
const waiters = [];
addEventListener("message", ev => {
  const e = ev.data && ev.data.ahboEvent; if (!e) return;
  log(new Date().toLocaleTimeString() + "  " + JSON.stringify(e));
  for (let i = waiters.length - 1; i >= 0; i--) if (waiters[i].match(e)){ waiters[i].resolve(e); waiters.splice(i, 1); }
});
const waitFor = match => new Promise(resolve => waiters.push({ match, resolve }));
const sleep = ms => new Promise(r => setTimeout(r, ms));

document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => send(JSON.parse(b.dataset.cmd)));
["idle","listening","thinking","curious","warm","alarm","sleepy"].forEach(m => {
  const b = document.createElement("button"); b.textContent = m; b.onclick = () => send({ type:"mood", mood:m });
  document.getElementById("moods").append(b);
});
document.getElementById("send").onclick = () => { try { send(JSON.parse(document.getElementById("json").value)); } catch(e){ log("bad JSON: " + e.message); } };
document.getElementById("rot").onclick = () => document.getElementById("bezel").classList.toggle("portrait");

/* ---------- Storyboards: the exact command sequences the harness sends ---------- */
// Speech without audio: durationSec makes the caption reveal at ~5 characters per second.
const dur = t => Math.max(1.2, Array.from(t).length / 5.2);
async function say(id, text, extra = {}){
  send({ type:"say_start", id, text, durationSec:dur(text), ...extra });
  await sleep(dur(text) * 1000 + 150);
  send({ type:"say_end", id });
  await waitFor(e => e.type === "say_done" && e.id === id);
}
async function herTurn(text){
  send({ type:"mood", mood:"listening" });
  const chars = Array.from(text);
  for (let i = 1; i <= chars.length; i += 3){ send({ type:"heard", text:chars.slice(0, i).join("") }); await sleep(180); }
  send({ type:"heard", text, final:true });
  await sleep(400);
}
const MEDS = [
  { id:"m1", label:"血壓藥",   small:"Amlodipine 5 mg",    pill:["--pill-b","--pill-a"] },
  { id:"m2", label:"糖尿藥",   small:"Metformin 500 mg",   pill:["--pill-a","--pill-a"] },
  { id:"m3", label:"膽固醇藥", small:"Atorvastatin 20 mg", pill:["--pill-a","--pill-c"] },
  { id:"m4", label:"薄血丸",   small:"Aspirin 80 mg",      pill:["--pill-c","--pill-a"] },
];
let running = false;
const STORIES = {
  async S1(){
    await herTurn("阿寶，今日有冇人搵過我呀？");
    send({ type:"mood", mood:"thinking" });
    send({ type:"steps", group:{ id:"s1", steps:[{ id:"msg", label:"檢查緊訊息…", doneLabel:"搵到阿珍嘅語音訊息", state:"active" }] } });
    await sleep(1200);
    send({ type:"step", group:"s1", id:"msg", state:"done" });
    send({ type:"mood", mood:"warm" });
    send({ type:"card", card:{ id:"vn1", kind:"voice_note", label:"阿珍嘅錄音", small:"今朝 7:42", when:"錄音" } });
    await say("s1a", "有呀！阿珍今朝留咗段錄音俾你，我而家播俾你聽。");
    send({ type:"card_update", id:"vn1", patch:{ playing:true } });
    await say("s1b", "媽，記得食飯呀！星期日我帶阿明嚟探你。", { from:"family", fromName:"阿珍" });
    send({ type:"card_update", id:"vn1", patch:{ playing:false } });
    await sleep(1500); send({ type:"mood", mood:"idle" }); send({ type:"steps_clear" });
  },
  async S2(){
    await herTurn("阿寶，我幾時食藥呀？");
    send({ type:"mood", mood:"thinking" });
    send({ type:"steps", group:{ id:"s2", steps:[{ id:"sched", label:"查緊藥物時間表…", doneLabel:"下一次：十二點正，四隻藥", state:"active" }] } });
    await sleep(900);
    send({ type:"step", group:"s2", id:"sched", state:"done" });
    send({ type:"mood", mood:"idle" });
    send({ type:"card", card:{ id:"next", kind:"event", icon:"⏰", label:"12:00 食藥", small:"兩個鐘之後", when:"十二點正" } });
    MEDS.forEach(m => send({ type:"card", card:{ ...m, kind:"med", when:m.label } }));
    await say("s2a", "兩個鐘之後，十二點正。有血壓藥、糖尿藥、膽固醇藥，同埋薄血丸。到時我會提你㗎。");
    await sleep(1500); send({ type:"steps_clear" });
  },
  async S3(){
    await herTurn("阿寶，我今日有咩安排呀？");
    send({ type:"mood", mood:"thinking" });
    send({ type:"steps", group:{ id:"s3a", steps:[
      { id:"cal",   label:"睇緊今日日程…",             doneLabel:"今日有兩個約會", state:"active" },
      { id:"route", label:"查緊去聯合醫院嘅巴士路線…", doneLabel:"路線已查好",     state:"pending" } ] } });
    await sleep(900);  send({ type:"step", group:"s3a", id:"cal", state:"done" });
    send({ type:"step", group:"s3a", id:"route", state:"active" });
    await sleep(1300); send({ type:"step", group:"s3a", id:"route", state:"done" });
    send({ type:"mood", mood:"idle" });
    send({ type:"card", card:{ id:"e1", kind:"event", label:"10:30 覆診", small:"聯合醫院", when:"覆診" } });
    send({ type:"card", card:{ id:"e2", kind:"plan",  label:"9:30 出門", small:"樓下巴士站", when:"九點半" } });
    send({ type:"card", card:{ id:"e3", kind:"event", icon:"🍵", label:"12:30 同阿珍飲茶", small:"觀塘", when:"飲茶" } });
    await say("s3a", "十點半你要去聯合醫院覆診，我已經查好路線，九點半喺樓下搭巴士就得。十二點半同阿珍飲茶。");
    await sleep(800);
    await herTurn("咁我下晝好悶喎……");
    send({ type:"steps_clear", group:"s3a" }); send({ type:"card_clear" });
    send({ type:"mood", mood:"thinking" });
    send({ type:"steps", group:{ id:"s3b", steps:[
      { id:"search", label:"搜尋緊附近長者活動…", doneLabel:"搵到：三點粵曲班", state:"active" },
      { id:"check",  label:"檢查緊時間同交通…",   doneLabel:"下晝得閒，行路十分鐘", state:"pending" } ] } });
    await sleep(1400); send({ type:"step", group:"s3b", id:"search", state:"done" });
    send({ type:"step", group:"s3b", id:"check", state:"active" });
    await sleep(1000); send({ type:"step", group:"s3b", id:"check", state:"done" });
    send({ type:"mood", mood:"curious" });
    send({ type:"card", card:{ id:"a1", kind:"activity", label:"3:00 粵曲班", small:"長者中心 · 可代報名", when:"粵曲班" } });
    await say("s3b", "附近長者中心下晝三點有粵曲班，可以識多啲朋友。想唔想去？我幫你報名吖。");
    send({ type:"mood", mood:"idle" });
    await sleep(1500); send({ type:"steps_clear" });
  },
  async S4(ok = false){
    send({ type:"reset" });
    send({ type:"mood", mood:"alarm" });
    send({ type:"card", card:{ id:"fall", kind:"incident", label:"偵測到跌倒", small:"感應器：急速下跌", persistent:true } });
    await say("f1", "哎呀！我感應到你好似跌低咗！");
    send({ type:"flash" });
    send({ type:"steps", group:{ id:"fall", title:"跌倒處理", steps:[
      { id:"photo", label:"分析緊相片…", doneLabel:"可能有人跌咗喺地下", state:"active" },
      { id:"ask",   label:"等婆婆回應",  doneLabel:"婆婆話冇事",         state:"pending" },
      { id:"call",  label:"致電緊急中心", doneLabel:"已致電緊急中心",     state:"pending" },
      { id:"tell",  label:"通知阿珍",     doneLabel:"已通知阿珍",         state:"pending" } ] } });
    await say("f2", "我而家影張相睇吓先。");
    await sleep(800); send({ type:"step", group:"fall", id:"photo", state:"done" });
    send({ type:"step", group:"fall", id:"ask", state:"active" });
    await say("f3", "王婆婆，如果你冇跌親，請講「我冇事」。");
    send({ type:"ok_button", show:true });
    send({ type:"countdown", id:"fall", n:5 });
    if (ok){
      await sleep(2300); send({ type:"heard", text:"我冇事", final:true });
      send({ type:"card_clear", id:"fall" }); send({ type:"card_clear" }); send({ type:"ok_button", show:false });
      send({ type:"step", group:"fall", id:"ask", state:"done" });
      send({ type:"step", group:"fall", id:"call", state:"failed", label:"唔使致電" });
      send({ type:"mood", mood:"warm" });
      await say("f5", "好彩冇事！慢慢起身，唔使急呀。");
      send({ type:"mood", mood:"idle" }); await sleep(1500); send({ type:"steps_clear" });
      return;
    }
    await waitFor(e => e.type === "countdown_done" && e.id === "fall");
    send({ type:"ok_button", show:false });
    send({ type:"step", group:"fall", id:"ask", state:"failed", label:"冇回應" });
    send({ type:"step", group:"fall", id:"call", state:"active" });
    send({ type:"step", group:"fall", id:"tell", state:"active" });
    send({ type:"card", card:{ id:"amb", kind:"action", label:"緊急中心", small:"已致電", when:"救護車" } });
    send({ type:"card", card:{ id:"chun", kind:"message", label:"已通知阿珍", small:"訊息已送出", when:"阿珍" } });
    await sleep(700); send({ type:"step", group:"fall", id:"tell", state:"done" });
    await sleep(500); send({ type:"step", group:"fall", id:"call", state:"done" });
    await say("f4", "我已經幫你叫咗救護車，同埋通知咗阿珍。唔使驚，救護車就嚟到。");
  },
};
document.querySelectorAll("[data-story]").forEach(b => b.onclick = async () => {
  if (running) return; running = true;
  try {
    const k = b.dataset.story;
    if (k !== "S4" && k !== "S4ok") send({ type:"reset" });
    await (k === "S4ok" ? STORIES.S4(true) : STORIES[k]());
  } finally { running = false; }
});
</script>
</body>
</html>
