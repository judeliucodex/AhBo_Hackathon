# config/wake_cases.yaml  — shared fixture for the Python (Stage 3) and Swift (Stage 2) Jyutping matchers (§25.6)
# 14 Nov (owner): STT tolerance back — homophones (威阿寶/喂阿保/喂亞寶), 喂寶 (missing aa) and the filler
# 喂喂阿寶 wake again (identical sounds; iPad speech recognition may write them differently).
# Different phrases still reject: 阿寶 alone, 喂阿爸, 喂阿婆, 喂寶寶, 我話喂阿寶, 餵飽, 喂呀阿寶.
accept: ["喂阿寶", "喂，阿寶", "喂 阿寶", "喂阿寶，今日有咩做呀？", "喂亞寶", "威阿寶", "喂阿保", "喂寶", "喂喂阿寶", "喂呀阿寶"]
reject: ["阿寶", "喂阿爸", "喂阿婆", "喂寶寶", "我話喂阿寶", "餵飽", "", "今日天氣好好"]
