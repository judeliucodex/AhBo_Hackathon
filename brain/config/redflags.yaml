# config/redflags.yaml
emergency: ["胸口痛", "心口痛", "胸口翳", "心口翳", "呼吸困難", "氣促", "唞唔切氣", "喘唔到氣", "唞唔到氣", "透唔到氣", "手腳冇力", "講嘢唔清楚", "暈低"]
urgent:    ["頭好暈", "好唔舒服", "發燒", "嘔", "想死", "唔想生存", "冇人理我"]
scam:      ["個孫被捕", "要過數", "銀行戶口", "警察打嚟", "入境處打嚟", "密碼", "驗證碼"]
# Regexes on the normalised transcript (NFKC, no punctuation/space, traditional, lower-case). They may only RAISE.
# 「胸口好痛」「心口好似好翳」「透大氣都透唔到」「唞氣唞唔到」 (QA 22 D1).
emergency_patterns: ["(胸口|心口|胸部|心臟).{0,4}(痛|翳|悶|壓住)", "(透|唞|抖|吸)(大)?氣.{0,4}(唔到|唔切|唔順|困難|不到|不了)",
                     "(半邊|一邊).{0,3}(冇力|麻|郁唔到)", "(講嘢|講話|把口).{0,3}(唔清|含糊|歪)"]
urgent_patterns:    ["(頭|個頭).{0,3}(好暈|暈到|爆)", "(好|非常)(唔舒服|辛苦)"]
