# config/ok_phrases.yaml   (normalised: punctuation/space removed, simplified→traditional)
# STT (ElevenLabs Scribe) often writes Simplified or formal Chinese: 我没事 → 我沒事, 起不了身, 跌倒 … are listed in
# their Traditional form; the matcher converts the transcript (OpenCC s2t) before comparing.
ok:   ["我冇事", "冇事", "無事", "我無事", "沒事", "我沒事", "沒有事", "冇跌親", "我好好", "OK", "ok", "冇問題", "沒問題"]
help: ["救命", "好痛", "起唔到身", "起唔到", "起不了身", "起不來", "爬不起", "站不起", "跌親", "跌倒", "摔倒", "痛",
       "幫我", "幫幫我", "唔得", "頭暈", "叫白車", "救護車"]
rule: "help wins over ok in the same utterance; 冇事/沒事 inside 有冇事/有沒有事 does not count as ok"
