# config/models.yaml  (values here are the defaults; §20. No model id or thinking level is hard-coded elsewhere.)
# Route (owner decision, 11 Nov): both models go through Opper (https://api.opper.ai/v3/compat, OPPER_API_KEY).
# Direct routes stay available: flash.provider deepseek (DEEPSEEK_API_KEY) · sonnet/vision provider anthropic.
flash:
  provider: opper               # deepseek | opper   (route set in §20.3)
  model: deepseek-v4.1-flash    # Opper model id (owner's Opper catalogue, 11 Nov); direct DeepSeek id: deepseek-flash
  thinking: "off"               # off | low | high | max     ← the on/off + level knob
  send_thinking: true           # send DeepSeek's `thinking` field; set false if the route rejects it (make doctor says)
  max_tokens: 400
  first_token_timeout_s: 5      # then retry once on the fallback
  fallback: { provider: opper, model: claude-haiku-5-5 }      # VERIFY the Haiku id in Opper's catalogue
  per_purpose:                  # each purpose can override the knob
    voice_turn:     { thinking: "off" }
    extractor:      { thinking: "off" }
    intent_tag:     { thinking: "off" }
    digest:         { thinking: "low" }
sonnet:
  provider: opper               # anthropic | opper   (§20.3). Opper = OpenAI-compatible loop: no server-side
                                # web search/fetch, no adaptive-thinking field; seeded + read-only tools only
  model: claude-sonnet-5-5
  thinking: "medium"            # off | low | medium | high | xhigh | max   ← the level knob
  display: omitted              # omitted | summarized (summaries shown in operator trace)
  max_tokens: 16000
  task_budget_tokens: 40000     # optional beta pacing, min 20000
  web_search_max_uses: 5
  web_fetch_max_uses: 5
  per_purpose:
    deep_task:        { thinking: "medium" }
    morning_plan:     { thinking: "high" }
    signup_fieldmap:  { thinking: "low" }
    eval_judge:       { thinking: "low" }
vision:
  provider: opper               # anthropic | opper (image sent as an OpenAI image_url data URL)
  model: claude-haiku-5-5
  fallback_model: claude-sonnet-5-5
  timeout_s: 8
# Speech (owner decision 11 Nov 2026: Azure sign-up blocked → ElevenLabs Starter). Read by ahbo.speech.config.
# Model ids live only here. Azure stays available: set stt/tts provider to `azure` (needs AZURE_SPEECH_KEY).
speech:
  stt:
    provider: elevenlabs        # elevenlabs | azure
    live_model: scribe_v3_live  # LiveKit worker (realtime websocket); alt: scribe_v2_realtime
    file_model: scribe_v2       # Telegram voice notes + doctor check (batch POST /v1/speech-to-text)
    language: yue               # forced: auto-detect calls her Cantonese "Mandarin" (BUILD_LOG §8)
    use_keyterms: true          # false = send no keyterms (A/B switch)
    # Bias list. Never put OK phrases (我冇事…) or 食-words here: a keyterm once turned 我冇事 into 我冇食.
    # Each term ≤ 50 chars and ≤ 4 spaces; realtime accepts ≤ 50 terms.
    keyterms: [阿寶, 王婆婆, 阿珍, 阿明, 血壓藥, 糖尿藥, 膽固醇藥, 薄血丸, 聯合醫院, 覆診, 觀塘, 秀茂坪,
               粵曲班, 長者中心, 救命, 起唔到身]
  tts:
    provider: elevenlabs        # elevenlabs | azure (Azure keeps AZURE_TTS_VOICE, rate -10 %)
    voice_id_env: ELEVENLABS_VOICE_ID   # "CY – Calm & Friendly" (Cantonese)
    language: yue               # sent as language_code (accepted by eleven_v4_turbo, verified 11 Nov)
    # Measured 11 Nov from this VPS (streaming endpoint, TTFB): v4_turbo 0.11–0.34 s, turbo_v2_5 0.15 s,
    # flash_v2_5 0.11 s (2.0 s cold), v3 0.71–1.0 s, v4 0.80 s. flash/turbo_v2_5 mangled the medicine names
    # in an STT round-trip (Mandarin-like reading); v4_turbo read them right (同埋…㗎).
    live_model: eleven_v4_turbo # LiveKit worker (streaming)
    fixed_model: eleven_v4      # fixed safety clips (POST /with-timestamps, rendered once)
    azure_fallback: true        # live only: Azure TTS as FallbackAdapter when AZURE_SPEECH_KEY is set
